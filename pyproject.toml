[project]
name = "python-sdk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guy Shaked", email = "guy@klinger.consulting" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.5.5",
    "aiolimiter>=1.2.1",
    "asyncpg>=0.30.0",
    "colorlog>=6.9.0",
    "dnspython>=2.7.0",
    "fastapi>=0.115.12",
    "faststream>=0.5.39",
    "httpx>=0.28.1",
    "inflect>=7.5.0",
    "jinja2>=3.1.6",
    "motor>=3.7.0",
    "phonenumbers>=9.0.2",
    "pika>=1.3.2",
    "psycopg[binary,pool]>=3.2.6",
    "py-cachify>=2.0.10",
    "pydantic-settings>=2.8.1",
    "pydantic[email]>=2.11.2",
    "pydash>=8.0.5",
    "pymongo>=4.11.3",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2",
    "redis>=5.2.1",
    "taskiq-faststream>=0.2.0",
    "uvicorn>=0.34.2",
]

[project.scripts]
python-sdk = "python_sdk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "icecream>=2.1.4",
    "ipython>=9.0.2",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.0",
    "rich>=14.0.0",
    "ruff>=0.11.3",
]

[tool.mypy]
python_version = "3.13"
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
implicit_optional = false
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
show_error_code_links = true
pretty = true
color_output = true
show_absolute_path = true
plugins = ["returns.contrib.mypy.returns_plugin"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 88
indent-width = 4



[tool.ruff.lint]
allowed-confusables = ["−", "ρ", "∗"]
fixable = ["ALL"]
ignore = []
select = ["E4", "E7", "E9", "F", "B", "Q"]
unfixable = []



[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "E402", "F403"]
"**/{tests,docs,tools}/*" = ["E402", "F403"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest.ini_options]
addopts = "--cov=src.buzzerpy --cov-report=term-missing"
