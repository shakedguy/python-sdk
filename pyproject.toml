[project]
name = "python-sdk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guy Shaked", email = "dev.shakedguy@gmail.com" }
]
requires-python = ">=3.13"

[project.scripts]
python-sdk = "python_sdk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_sdk"]


dependencies = [
    "aiolimiter>=1.2.1",
    "cachier>=4.1.0",
    "colorlog>=6.9.0",
    "dnspython>=2.7.0",
    "fastapi>=0.115.12",
    "funcy>=2.0",
    "glom>=24.11.0",
    "httpx>=0.28.1",
    "inflect>=7.5.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "ollama>=0.5.3",
    "orjson>=3.10.18",
    "phonenumbers>=9.0.2",
    "plumbum>=1.9.0",
    "py-cachify>=2.0.10",
    "pydantic-settings>=2.8.1",
    "pydantic[email]>=2.11.2",
    "pydash>=8.0.5",
    "python-dateutil>=2.9.0.post0",
    "python-levenshtein>=0.27.1",
    "python-socketio>=5.13.0",
    "pytz>=2025.2",
    "redis>=5.2.1",
    "uvicorn>=0.34.2",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.15.5", "motor==3.7.1"]
messaging = [
    "pika>=1.3.2",
    "aio-pika>=9.5.7",
    "taskiq-aio-pika>=0.4.4",
    "faststream[cli,confluent,rabbit,redis]>=0.6.4",
    "taskiq-faststream[kafka,rabbit,redis]>=0.3.2",
]
qdrant = ["qdrant-client[fastembed]>=1.15.1"]
postgres = ["asyncpg>=0.30.0", "psycopg[binary,pool]>=3.2.9"]
all = [
    "pymongo>=4.15.5",
    "motor==3.7.1",
    "pika>=1.3.2",
    "aio-pika>=9.5.7",
    "taskiq-aio-pika>=0.4.4",
    "faststream[cli,confluent,rabbit,redis]>=0.6.4",
    "taskiq-faststream[kafka,rabbit,redis]>=0.3.2",
    "qdrant-client[fastembed]>=1.15.1",
    "asyncpg>=0.30.0",
    "psycopg[binary,pool]>=3.2.9",
]



[dependency-groups]
dev = [
    "icecream>=2.1.4",
    "ipython>=9.0.2",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.0",
    "rich>=14.0.0",
    "ruff>=0.11.3",
    "types-cachetools>=6.2.0.20250827",
]





[tool.mypy]
python_version = "3.13"
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
implicit_optional = false
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
show_error_code_links = true
pretty = true
color_output = true
show_absolute_path = true
plugins = ["returns.contrib.mypy.returns_plugin"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 88
indent-width = 4



[tool.ruff.lint]
allowed-confusables = ["−", "ρ", "∗"]
fixable = ["ALL"]
ignore = []
select = ["E4", "E7", "E9", "F", "B", "Q"]
unfixable = []



[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "E402", "F403"]
"**/{tests,docs,tools}/*" = ["E402", "F403"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest.ini_options]
addopts = "--cov=src.buzzerpy --cov-report=term-missing"
